<body>

<div class="header">

<div class="back" onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</div>

<div class="title">

Community

</div>

<div style="width:45px;"></div>

</div>

<div class="search">

<input
type="text"
id="searchPost"
placeholder="Search Community Posts...">

</div>

<div class="post-box">

<textarea
id="postInput"
placeholder="What's on your mind?"></textarea>

<div class="post-actions">

<div class="upload">

<i class="fa-regular fa-image"></i>

<i class="fa-regular fa-face-smile"></i>

</div>

<button
class="post-btn"
id="postBtn">

Post

</button>

</div>

</div>

<div class="feed-title">

Latest Posts

</div>

<div
class="feed"
id="feed">

</div>
<script>

let posts = JSON.parse(localStorage.getItem("polyhub_posts")) || [];

const users = JSON.parse(localStorage.getItem("polyhub_users")) || [];

const currentUser = JSON.parse(localStorage.getItem("polyhub_current_user"));

const feed = document.getElementById("feed");

const postInput = document.getElementById("postInput");

const postBtn = document.getElementById("postBtn");

function getCurrentName(){

if(currentUser){

return currentUser.name;

}

return "Student";

}

function createPost(){

const text = postInput.value.trim();

if(text===""){

alert("Write something first.");

return;

}

const post={

id:Date.now(),

name:getCurrentName(),

text:text,

time:new Date().toLocaleString(),

likes:0,

comments:[]

};

posts.unshift(post);

localStorage.setItem("polyhub_posts",JSON.stringify(posts));

postInput.value="";

renderPosts();

}

postBtn.addEventListener("click",createPost);

function renderPosts(keyword=""){

feed.innerHTML="";

const list = posts.filter(post=>{

return post.text.toLowerCase().includes(keyword.toLowerCase()) ||

post.name.toLowerCase().includes(keyword.toLowerCase());

});

if(list.length===0){

feed.innerHTML=`

<div class="post-card">

<div class="post-text">

No Community Posts Yet.

</div>

</div>

`;

return;

}

list.forEach(post=>{

const first = post.name.charAt(0).toUpperCase();

feed.innerHTML += `

<div class="post-card">

<div class="user">

<div class="avatar">

${first}

</div>

<div class="user-info">

<h3>

${post.name}

</h3>

<p>

${post.time}

</p>

</div>

</div>

<div class="post-text">

${post.text}

</div>

<div class="post-footer"

id="footer-${post.id}">

</div>

</div>

`;

});

}

renderPosts();

document.getElementById("searchPost").addEventListener("keyup",function(){

renderPosts(this.value);

});

</script>
<style>

.post-footer{

display:flex;

justify-content:space-between;

align-items:center;

border-top:1px solid rgba(255,255,255,.2);

padding-top:12px;

margin-top:10px;

.action{

align-items:center;

}

.action:hover{

}

}

.comment-box{

display:none;

}

.comment-box input{

width:100%;

padding:12px;

border:none;

outline:none;

border-radius:10px;

margin-bottom:10px;

}

.comment-btn{

padding:10px 18px;

border:none;

border-radius:10px;

background:#fff;

color:#4F46E5;

font-weight:600;

cursor:pointer;

}

.comment-list{

margin-top:12px;

font-size:14px;

line-height:1.7;

}

.comment-item{

background:rgba(255,255,255,.12);

padding:10px;

border-radius:10px;

margin-bottom:8px;

}

</style>

<script>

function renderPosts(keyword=""){

feed.innerHTML="";

const list=posts.filter(post=>

post.text.toLowerCase().includes(keyword.toLowerCase()) ||

post.name.toLowerCase().includes(keyword.toLowerCase())

);

if(list.length===0){

feed.innerHTML=`
<div class="post-card">
<div class="post-text">
No Community Posts Yet.
</div>
</div>
`;

return;

}

list.forEach(post=>{

const first=post.name.charAt(0).toUpperCase();

feed.innerHTML+=`

<div class="post-card">

<div class="user">

<div class="avatar">

${first}

</div>

<div class="user-info">

<h3>${post.name}</h3>

<p>${post.time}</p>

</div>

</div>

<div class="post-text">

${post.text}

</div>

<div class="post-footer">

<div class="action"

onclick="likePost(${post.id})">

<i class="fa-solid fa-heart"></i>

<span>${post.likes}</span>

</div>

<div class="action"

onclick="toggleComment(${post.id})">

<i class="fa-solid fa-comment"></i>

<span>${post.comments.length}</span>

</div>

<div class="action"

onclick="sharePost(${post.id})">

<i class="fa-solid fa-share"></i>

</div>

<div class="action"

onclick="deletePost(${post.id})">

<i class="fa-solid fa-trash"></i>

</div>

</div>

<div

class="comment-box"

id="comment-${post.id}">

<input

type="text"

id="commentInput-${post.id}"

placeholder="Write a comment...">

<button

class="comment-btn"

onclick="addComment(${post.id})">

Comment

</button>

<div

class="comment-list"

id="commentList-${post.id}">

${post.comments.map(c=>`<div class="comment-item">${c}</div>`).join("")}

</div>

</div>

</div>

`;

});

}

function likePost(id){

const post=posts.find(p=>p.id===id);

post.likes++;

localStorage.setItem("polyhub_posts",JSON.stringify(posts));

renderPosts();

}

function toggleComment(id){

const box=document.getElementById("comment-"+id);

box.style.display=box.style.display==="block"?"none":"block";

}

function addComment(id){

const input=document.getElementById("commentInput-"+id);

const text=input.value.trim();

if(text==="") return;

const post=posts.find(p=>p.id===id);

post.comments.push(text);

localStorage.setItem("polyhub_posts",JSON.stringify(posts));

renderPosts();

}

function sharePost(id){

alert("Share Feature Coming Soon");

}

function deletePost(id){

posts=posts.filter(p=>p.id!==id);

localStorage.setItem("polyhub_posts",JSON.stringify(posts));

renderPosts();

}

</script>

<script>

setInterval(function(){

document.querySelectorAll(".post-btn,.action").forEach(btn=>{
