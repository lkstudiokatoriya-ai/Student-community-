<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polytechnic Hub - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4F46E5,#7C3AED,#06B6D4);
overflow:hidden;
}

.card{
width:90%;
max-width:380px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(20px);
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
color:white;
}

.logo{
font-size:28px;
text-align:center;
margin-bottom:10px;
}

.title{
text-align:center;
font-size:26px;
font-weight:700;
margin-bottom:5px;
}

.subtitle{
text-align:center;
font-size:14px;
opacity:.8;
margin-bottom:25px;
}

.input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
margin-bottom:15px;
font-size:15px;
}

.password-box{
position:relative;
}

.password-box span{
position:absolute;
right:15px;
top:15px;
cursor:pointer;
color:#555;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#ffffff;
color:#4F46E5;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

.bottom{
margin-top:20px;
text-align:center;
font-size:14px;
}

.bottom a{
color:#fff;
font-weight:600;
text-decoration:none;
}

.remember{
display:flex;
align-items:center;
gap:8px;
margin-bottom:15px;
font-size:14px;
}
</style>

</head>
<body>

<div class="card">

<div class="logo">🎓</div>

<div class="title">
Polytechnic Hub
</div>

<div class="subtitle">
Student Community Login
</div>

<form id="loginForm">

<input
type="text"
class="input"
placeholder="Mobile Number"
required>

<div class="password-box">

<input
type="password"
id="password"
class="input"
placeholder="Password"
required>

<span onclick="togglePassword()">👁</span>

</div>

<div class="remember">

<input type="checkbox">

Remember Me

</div>

<button type="submit">
Login
</button>

</form>

<div class="bottom">

Don't have an account?

<a href="register.html">
Register
</a>

</div>

</div>

<script>

function togglePassword(){

let p=document.getElementById("password");

if(p.type==="password"){
p.type="text";
}else{
p.type="password";
}

}

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

// बाद में यहाँ Login Validation आएगा

window.location.href="home.html";

});

</script>

</body>
</html>
