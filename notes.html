<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#4F46E5,#7C3AED,#06B6D4);

min-height:100vh;

padding:20px;

padding-bottom:100px;

color:#fff;

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.back{

width:45px;

height:45px;

border-radius:50%;

background:rgba(255,255,255,.15);

display:flex;

justify-content:center;

align-items:center;

backdrop-filter:blur(15px);

cursor:pointer;

}

.title{

font-size:24px;

font-weight:700;

}

.search{

margin-bottom:20px;

}

.search input{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:15px;

font-size:15px;

}

.upload-card{

background:rgba(255,255,255,.15);

backdrop-filter:blur(20px);

padding:20px;

border-radius:20px;

margin-bottom:20px;

}

.upload-card input{

width:100%;

padding:14px;

border:none;

outline:none;

border-radius:12px;

margin-bottom:12px;

}

.upload-card select{

width:100%;

padding:14px;

border:none;

outline:none;

border-radius:12px;

margin-bottom:12px;

}

.upload-btn{

width:100%;

padding:14px;

border:none;

border-radius:12px;

background:#fff;

color:#4F46E5;

font-weight:700;

cursor:pointer;

}

.section{

font-size:18px;

font-weight:600;

margin-bottom:15px;

}

.note-list{

display:flex;

flex-direction:column;

gap:15px;

}

.note-card{

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

padding:18px;

border-radius:18px;

}

.note-card h3{

margin-bottom:8px;

}

.note-card p{

font-size:14px;

opacity:.9;

margin-bottom:15px;

line-height:1.5;

}

.download{

padding:10px 18px;

border:none;

border-radius:10px;

background:#fff;

color:#4F46E5;

font-weight:600;

cursor:pointer;

}

</style>

</head>

<body>

<div class="header">

<div class="back"

onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</div>

<div class="title">

Study Notes

</div>

<div style="width:45px;"></div>

</div>

<div class="search">

<input

type="text"

id="searchNote"

placeholder="Search Notes...">

</div>

<div class="upload-card">

<input

type="text"

id="noteTitle"

placeholder="Note Title">

<select id="noteSubject">

<option>Electrical</option>

<option>Mechanical</option>

<option>Civil</option>

<option>Computer</option>

<option>Electronics</option>

</select>

<input

type="text"

id="noteLink"

placeholder="PDF Link">

<button

class="upload-btn"

id="uploadBtn">

Share Note

</button>

</div>

<div class="section">

Latest Notes

</div>

<div

class="note-list"

id="noteList">

</div>
<script>

let notes = JSON.parse(localStorage.getItem("polyhub_notes")) || [];

const noteList = document.getElementById("noteList");

function renderNotes(keyword=""){

noteList.innerHTML="";

const filtered = notes.filter(note=>

note.title.toLowerCase().includes(keyword.toLowerCase()) ||

note.subject.toLowerCase().includes(keyword.toLowerCase())

);

if(filtered.length===0){

noteList.innerHTML=`

<div class="note-card">

<h3>No Notes Found</h3>

<p>Share the first study note with the community.</p>

</div>

`;

return;

}

filtered.forEach((note,index)=>{

noteList.innerHTML+=`

<div class="note-card">

<h3>${note.title}</h3>

<p>📚 ${note.subject}</p>

<button class="download"

onclick="openNote('${note.link}')">

Open PDF

</button>

<button class="download"

style="margin-left:10px;background:#ef4444;color:#fff"

onclick="deleteNote(${index})">

Delete

</button>

</div>

`;

});

}

document.getElementById("uploadBtn").addEventListener("click",function(){

const title=document.getElementById("noteTitle").value.trim();

const subject=document.getElementById("noteSubject").value;

const link=document.getElementById("noteLink").value.trim();

if(title===""||link===""){

alert("Please fill all fields.");

return;

}

notes.unshift({

title,

subject,

link

});

localStorage.setItem("polyhub_notes",JSON.stringify(notes));

document.getElementById("noteTitle").value="";

document.getElementById("noteLink").value="";

renderNotes();

});

function openNote(link){

window.open(link,"_blank");

}

function deleteNote(index){

if(confirm("Delete this note?")){

notes.splice(index,1);

localStorage.setItem("polyhub_notes",JSON.stringify(notes));

renderNotes();

}

}

document.getElementById("searchNote").addEventListener("keyup",function(){

renderNotes(this.value);

});

renderNotes();

</script>
