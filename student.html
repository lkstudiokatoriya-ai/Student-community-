<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Students | Polytechnic Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#4F46E5,#7C3AED,#06B6D4);

min-height:100vh;

color:#fff;

padding:20px;

padding-bottom:90px;

}

.header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:20px;

}

.header h2{

font-size:24px;

}

.back{

width:45px;

height:45px;

border-radius:50%;

background:rgba(255,255,255,.15);

display:flex;

justify-content:center;

align-items:center;

backdrop-filter:blur(15px);

cursor:pointer;

}

.search{

margin-bottom:20px;

}

.search input{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:15px;

font-size:15px;

}

.student{

display:flex;

align-items:center;

justify-content:space-between;

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

padding:15px;

border-radius:18px;

margin-bottom:15px;

}

.left{

display:flex;

align-items:center;

gap:15px;

}

.avatar{

width:55px;

height:55px;

border-radius:50%;

background:#fff;

color:#4F46E5;

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

font-weight:bold;

}

.info h3{

font-size:16px;

margin-bottom:3px;

}

.info p{

font-size:13px;

opacity:.9;

}

.right{

display:flex;

flex-direction:column;

gap:8px;

}

.btn{

padding:8px 12px;

border:none;

border-radius:10px;

cursor:pointer;

font-size:12px;

font-weight:600;

}

.view{

background:#fff;

color:#4F46E5;

}

.message{

background:#06B6D4;

color:#fff;

}

.online{

color:#00ff88;

font-size:12px;

margin-top:3px;

}

.offline{

color:#ff5f5f;

font-size:12px;

margin-top:3px;

}

.empty{

text-align:center;

margin-top:60px;

opacity:.8;

font-size:15px;

}

</style>

</head>

<body>

<div class="header">

<div class="back" onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</div>

<h2>

Students

</h2>

<div style="width:45px;"></div>

</div>

<div class="search">

<input

type="text"

id="search"

placeholder="Search Student...">

</div>

<div id="studentList">

</div>

<div class="empty" id="emptyBox" style="display:none;">

No Student Found

</div>
<script>

let students = JSON.parse(localStorage.getItem("polyhub_users")) || [];

const list = document.getElementById("studentList");
const empty = document.getElementById("emptyBox");
const search = document.getElementById("search");

function renderStudents(keyword=""){

list.innerHTML="";

const data = students.filter(student=>{

return student.name.toLowerCase().includes(keyword.toLowerCase()) ||

student.college.toLowerCase().includes(keyword.toLowerCase()) ||

student.branch.toLowerCase().includes(keyword.toLowerCase());

});

if(data.length===0){

empty.style.display="block";

return;

}

empty.style.display="none";

data.forEach(student=>{

const firstLetter=student.name.charAt(0).toUpperCase();

const online=Math.random()>0.5;

list.innerHTML+=`

<div class="student">

<div class="left">

<div class="avatar">

${firstLetter}

</div>

<div class="info">

<h3>${student.name}</h3>

<p>${student.college}</p>

<p>${student.branch} | ${student.semester}</p>

<div class="${online?'online':'offline'}">

${online?'🟢 Online':'🔴 Offline'}

</div>

</div>

</div>

<div class="right">

<button class="btn view">

View

</button>

<button class="btn message">

Message

</button>

</div>

</div>

`;

});

}

renderStudents();

search.addEventListener("keyup",function(){

renderStudents(this.value);

});

</script>

position:fixed;

bottom:0;

left:0;

width:100%;

height:75px;

background:rgba(255,255,255,.15);

display:flex;

justify-content:space-around;

align-items:center;

border-top:1px solid rgba(255,255,255,.2);

}

.bottom-nav a{

display:flex;

color:white;

}

font-size:20px;

margin-bottom:4px;

}

color:#FFD700;

}

</style>

</a>

</div>

</body>
