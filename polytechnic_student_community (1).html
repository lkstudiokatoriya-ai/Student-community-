<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polytechnic Hub | Student Community</title>
    
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <script>
        const manifestData = {
            "name": "Polytechnic Hub", "short_name": "PolyHub", "start_url": ".", "display": "standalone",
            "background_color": "#0f172a", "theme_color": "#4f46e5",
            "icons": [{"src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxOTIiIGhlaWdodD0iMTkyIiB2aWV3Qm94PSIwIDAgMTkyIDE5MiI+PHJlY3Qgd2lkdGg9IjE5MiIgaGVpZ2h0PSIxOTIiIGZpbGw9IiM0ZjQ2ZTUiLz48dGV4dCB4PSI1MCIgeT0iMTIwIiBmb250LXNpemU9IjgwaHB4IiBmaWxsPSJ3aGl0ZSI+UDwvdGV4dD48L3N2Zz4=", "sizes": "192x192", "type": "image/svg+xml"}]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/manifest+json'});
        document.write(`<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);
    </script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --text-main: #1e293b;
            --text-muted: #475569;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: rgba(0, 0, 0, 0.1);
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --input-bg: rgba(255, 255, 255, 0.5);
            --nav-bg: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: rgba(0, 0, 0, 0.4);
            --primary-color: #818cf8;
            --primary-hover: #6366f1;
            --input-bg: rgba(15, 23, 42, 0.6);
            --nav-bg: rgba(15, 23, 42, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); min-height: 100vh; overflow-x: hidden; transition: all 0.3s ease; }

        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .mb-1 { margin-bottom: 0.5rem; } .mb-2 { margin-bottom: 1rem; } .mb-3 { margin-bottom: 1.5rem; } .mt-2 { margin-top: 1rem; }
        .flex { display: flex; } .justify-between { justify-content: space-between; } .align-center { align-items: center; } .gap-2 { gap: 0.5rem; } .gap-4 { gap: 1rem; }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 8px 32px var(--glass-shadow);
            padding: 1.5rem; width: 90%; max-width: 600px; margin: 1.5rem auto; animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; font-weight: 500; }
        .form-control {
            width: 100%; padding: 0.8rem 1rem; border-radius: 12px; border: 1px solid var(--glass-border);
            background: var(--input-bg); color: var(--text-main); outline: none; transition: border-color 0.3s;
        }
        .form-control:focus { border-color: var(--primary-color); }
        select.form-control { appearance: none; cursor: pointer; }

        .btn {
            width: 100%; padding: 0.8rem; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease; display: inline-flex; justify-content: center; align-items: center; gap: 0.5rem;
        }
        .btn-primary { background: var(--primary-color); color: white; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-whatsapp { background: #25D366; color: white; margin-bottom: 1rem;}
        .btn-email { background: #ea4335; color: white; }
        .btn-success { background: var(--success-color); color: white; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-warning { background: var(--warning-color); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .btn-text { background: transparent; color: var(--primary-color); padding: 0.5rem; width: auto; font-size: 0.85rem;}

        #app-layout { display: flex; flex-direction: column; height: 100vh; }
        .app-header {
            background: var(--nav-bg); backdrop-filter: blur(10px); padding: 1rem; display: flex;
            justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--glass-border);
        }
        .app-content { flex: 1; overflow-y: auto; padding: 1rem; padding-bottom: 80px; }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--nav-bg); backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border); display: flex; justify-content: space-around; padding: 0.6rem 0;
            z-index: 100; padding-bottom: calc(0.6rem + env(safe-area-inset-bottom));
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; color: var(--text-muted);
            text-decoration: none; font-size: 0.7rem; gap: 0.2rem; cursor: pointer; transition: color 0.3s;
        }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { color: var(--primary-color); }

        /* General List Cards */
        .list-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
        }
        .avatar {
            width: 45px; height: 45px; border-radius: 50%; background: var(--primary-color); color: white;
            display: flex; justify-content: center; align-items: center; font-size: 1.1rem; font-weight: bold; object-fit: cover; flex-shrink: 0;
        }

        /* Feed Post Specifics */
        .post-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1rem; margin-bottom: 1rem; }
        .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; }
        .post-user-info { display: flex; gap: 0.8rem; align-items: center; }
        .post-user-info h4 { margin-bottom: 0.1rem; font-size: 1rem; display: flex; align-items: center; gap: 0.4rem; }
        .post-user-info p { font-size: 0.75rem; color: var(--text-muted); line-height: 1.2; }
        .post-content { font-size: 0.95rem; margin-bottom: 1rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;}
        .post-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--glass-border); padding-top: 0.8rem; }
        .action-btn { background: none; border: none; color: var(--text-muted); font-size: 0.9rem; display: flex; gap: 0.4rem; align-items: center; cursor: pointer; transition: color 0.2s; }
        .action-btn:hover, .action-btn.active { color: var(--primary-color); }
        .pinned-badge { color: var(--warning-color); font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; gap: 0.2rem; margin-bottom: 0.5rem;}
        
        .comments-section { margin-top: 1rem; border-top: 1px dashed var(--glass-border); padding-top: 1rem; display: none; }
        .comment-item { display: flex; gap: 0.6rem; margin-bottom: 0.8rem; background: var(--input-bg); padding: 0.6rem; border-radius: 12px; }
        .comment-item .avatar { width: 30px; height: 30px; font-size: 0.8rem; }
        .reply-item { margin-left: 2.5rem; margin-top: 0.5rem; }

        /* Overlays & Modals */
        .loader-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-gradient); z-index: 9999;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 10000;
            display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px);
        }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--glass-border); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .view-tabs { display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem; overflow-x: auto;}
        .view-tab { padding: 0.5rem 1rem; cursor: pointer; white-space: nowrap; color: var(--text-muted); border-radius: 20px; font-size: 0.9rem;}
        .view-tab.active { background: var(--primary-color); color: white; }
    </style>
</head>
<body>

    <div id="loader" class="loader-overlay">
        <div class="spinner mb-2"></div>
        <h3 id="loader-text">Initializing Community...</h3>
    </div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="modal-overlay hidden">
        <div class="glass-panel" style="width: 85%; max-width: 400px; margin: 0;">
            <h3 id="modal-title" class="mb-2">Title</h3>
            <div id="modal-body" class="mb-3 text-muted" style="font-size: 0.9rem;"></div>
            <div id="modal-actions" class="flex gap-2 justify-between"></div>
        </div>
    </div>

    <div id="app-root">

        <!-- ================= LOGIN ================= -->
        <div id="view-login" class="view-section hidden">
            <div class="glass-panel text-center">
                <i class="fa-solid fa-graduation-cap mb-2" style="font-size: 3rem; color: var(--primary-color);"></i>
                <h2 class="mb-2">PolyHub</h2>
                <form id="form-login">
                    <div class="form-group"><input type="text" id="login-phone" class="form-control" placeholder="Mobile Number" required></div>
                    <div class="form-group"><input type="password" id="login-pass" class="form-control" placeholder="Password" required></div>
                    <button type="submit" class="btn btn-primary mb-2">Login</button>
                    <button type="button" class="btn btn-text" onclick="switchView('view-register')">New Student? Register Here</button>
                </form>
            </div>
        </div>

        <!-- ================= REGISTER ================= -->
        <div id="view-register" class="view-section hidden">
            <div class="glass-panel" style="max-height: 90vh; overflow-y: auto;">
                <h2 class="text-center mb-3">Student Registration</h2>
                <form id="form-register">
                    <div class="form-group"><input type="text" id="reg-name" class="form-control" placeholder="Full Name *" required></div>
                    <div class="form-group"><input type="tel" id="reg-phone" class="form-control" placeholder="Mobile Number *" required></div>
                    <div class="form-group"><input type="password" id="reg-pass" class="form-control" placeholder="Password *" required></div>
                    <div class="form-group"><input type="text" id="reg-college" class="form-control" placeholder="College Name *" required></div>
                    <div class="form-group">
                        <select id="reg-branch" class="form-control" required>
                            <option value="">Select Branch *</option><option value="Computer Science">Computer Science</option>
                            <option value="Mechanical">Mechanical</option><option value="Civil">Civil</option>
                            <option value="Electrical">Electrical</option><option value="Electronics">Electronics</option>
                        </select>
                    </div>
                    <div class="form-group flex gap-2">
                        <select id="reg-sem" class="form-control" required style="flex:1">
                            <option value="">Sem *</option><option value="1st">1st</option><option value="2nd">2nd</option>
                            <option value="3rd">3rd</option><option value="4th">4th</option><option value="5th">5th</option><option value="6th">6th</option>
                        </select>
                        <input type="text" id="reg-session" class="form-control" placeholder="Session (e.g. 23-26) *" required style="flex:1">
                    </div>
                    <div class="form-group"><input type="url" id="reg-dp" class="form-control" placeholder="Profile Photo URL (Optional)"></div>
                    <div class="form-group"><textarea id="reg-bio" class="form-control" rows="2" placeholder="Bio (Optional)"></textarea></div>
                    <button type="submit" class="btn btn-primary mb-2">Submit Registration</button>
                    <div class="text-center"><button type="button" class="btn btn-text" onclick="switchView('view-login')">Back to Login</button></div>
                </form>
            </div>
        </div>

        <!-- ================= WAITING ================= -->
        <div id="view-waiting" class="view-section hidden text-center">
            <div class="glass-panel">
                <i class="fa-solid fa-clock-rotate-left mb-2" style="font-size: 3rem; color: var(--primary-color);"></i>
                <h2 class="mb-2">Approval Pending</h2>
                <p class="mb-3">Your account is under review.</p>
                <a href="https://wa.me/919296783036?text=Hello%20Admin%2C%20I%20have%20registered.%20Please%20approve%20my%20account." target="_blank" style="text-decoration: none;"><button class="btn btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp Admin</button></a>
                <a href="mailto:support.polytechnichub@gmail.com?subject=Registration%20Approval%20Request" style="text-decoration: none;"><button class="btn btn-email mb-3"><i class="fa-solid fa-envelope"></i> Email Support</button></a>
                <button class="btn btn-text" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- ================= DASHBOARD APP LAYOUT ================= -->
        <div id="view-dashboard" class="view-section hidden">
            <div id="app-layout">
                <header class="app-header">
                    <h2 id="header-title">Feed</h2>
                    <div class="flex align-center gap-4">
                        <i class="fa-solid fa-moon theme-toggle" style="cursor:pointer;" onclick="toggleTheme()"></i>
                    </div>
                </header>

                <main class="app-content" id="dashboard-content"></main>

                <nav class="bottom-nav">
                    <div class="nav-item active" onclick="switchTab('feed', this)"><i class="fa-solid fa-house"></i><span>Feed</span></div>
                    <div class="nav-item" onclick="switchTab('community', this)"><i class="fa-solid fa-users"></i><span>Hub</span></div>
                    <div class="nav-item" onclick="switchTab('resources', this)"><i class="fa-solid fa-file-pdf"></i><span>Notes</span></div>
                    <div class="nav-item" onclick="switchTab('chat-list', this)"><i class="fa-solid fa-comments"></i><span>Chats</span></div>
                    <div class="nav-item" onclick="switchTab('profile', this)"><i class="fa-solid fa-user"></i><span>Profile</span></div>
                </nav>
            </div>
        </div>

        <!-- ================= ADMIN PANEL ================= -->
        <div id="view-admin" class="view-section hidden">
            <div id="app-layout">
                <header class="app-header">
                    <h2>Admin Dashboard</h2>
                    <i class="fa-solid fa-right-from-bracket theme-toggle" style="cursor:pointer;" onclick="logout()"></i>
                </header>
                <main class="app-content">
                    <div class="view-tabs">
                        <div class="view-tab active" onclick="switchAdminTab('pending', this)">Pending</div>
                        <div class="view-tab" onclick="switchAdminTab('all', this)">All Users</div>
                        <div class="view-tab" onclick="switchTab('feed', this); switchView('view-dashboard');">Go to Feed</div>
                    </div>
                    <div id="admin-content-area"></div>
                </main>
            </div>
        </div>

    </div>

    <!-- ================= TEMPLATES ================= -->

    <!-- FEED TEMPLATE -->
    <template id="tpl-feed">
        <div class="mb-2 flex gap-2 align-center">
            <input type="text" id="search-feed" class="form-control" placeholder="Search posts, users, branches..." onkeyup="renderFeed()">
        </div>
        <div class="glass-panel" style="width: 100%; margin: 0 0 1rem 0; padding: 1rem;">
            <textarea id="new-post-content" class="form-control mb-1" rows="2" placeholder="Share an update, question, or note..."></textarea>
            <div class="flex justify-between align-center">
                <select id="new-post-vis" class="form-control" style="width: auto; padding: 0.4rem; font-size: 0.8rem;">
                    <option value="public">Public</option>
                    <option value="private">Friends Only</option>
                </select>
                <button class="btn btn-primary" style="width: auto; padding: 0.5rem 1.5rem;" onclick="createPost()">Post</button>
            </div>
        </div>
        <div id="feed-list"></div>
    </template>

    <!-- HUB (COMMUNITY) TEMPLATE -->
    <template id="tpl-community">
        <div class="mb-3"><input type="text" id="search-users" class="form-control" placeholder="Search students..." onkeyup="filterCommunity()"></div>
        <div id="community-list"></div>
    </template>

    <!-- RESOURCES TEMPLATE -->
    <template id="tpl-resources">
        <div class="view-tabs">
            <div class="view-tab active" onclick="renderResources('pdf')">PDFs</div>
            <div class="view-tab" onclick="renderResources('note')">Notes</div>
        </div>
        <div class="glass-panel" style="width: 100%; margin: 0 0 1rem 0; padding: 1rem;">
            <div class="flex gap-2 mb-2">
                <select id="res-type" class="form-control" style="width: 30%;"><option value="pdf">PDF Link</option><option value="note">Text Note</option></select>
                <input type="text" id="res-title" class="form-control" placeholder="Title/Topic" style="width: 70%;">
            </div>
            <input type="text" id="res-content" class="form-control mb-2" placeholder="URL (for PDF) or Note text (for Note)">
            <button class="btn btn-primary" onclick="addResource()">Share with Community</button>
        </div>
        <div id="resources-list"></div>
    </template>

    <!-- CHAT TEMPLATE -->
    <template id="tpl-chat-list">
        <p class="text-center text-muted mb-2"><small><i class="fa-solid fa-lock" style="color: var(--success-color)"></i> Secure Messaging</small></p>
        <div id="active-chats-list"></div>
    </template>

    <!-- PROFILE TEMPLATE -->
    <template id="tpl-profile">
        <div class="glass-panel text-center" style="width: 100%; margin: 0 auto; padding: 2rem 1rem;">
            <div id="profile-dp-container"></div>
            <h2 id="my-name"></h2>
            <p id="my-branch" class="text-muted"></p>
            <p id="my-college" class="mb-2"></p>
            
            <div id="friend-requests-area" class="mb-2"></div>

            <button class="btn btn-danger mb-2" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            <button class="btn btn-outline" onclick="showModal('Coming Soon', 'Profile editing will be available in the next update.', [{text:'OK', class:'btn-primary'}])"><i class="fa-solid fa-gear"></i> Settings</button>
        </div>
    </template>

    <!-- Chat Overlay -->
    <div id="view-chatroom" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gradient); z-index: 200;">
        <div style="display: flex; flex-direction: column; height: 100vh;">
            <div class="app-header">
                <div class="flex gap-2 align-center">
                    <i class="fa-solid fa-arrow-left" style="font-size: 1.2rem; cursor: pointer;" onclick="closeChat()"></i>
                    <div class="avatar" id="chat-header-avatar" style="width: 35px; height: 35px; font-size:1rem;">U</div>
                    <h3 id="chat-header-name" style="font-size:1rem;">Name</h3>
                </div>
            </div>
            <div id="chat-messages-area" style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem;"></div>
            <div style="padding: 1rem; background: var(--nav-bg); backdrop-filter: blur(10px); display: flex; gap: 0.5rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); border-top: 1px solid var(--glass-border);">
                <input type="text" id="chat-input" class="form-control" placeholder="Type a message...">
                <button class="btn btn-primary" style="width: auto;" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>


    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'polyhub-v2';
        const rawFirebaseConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : '{"projectId": "dummy"}';
        const initToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, auth, db;
        try {
            app = firebase.initializeApp(JSON.parse(rawFirebaseConfig));
            // FIXED: Using Firebase Compat API correctly
            auth = firebase.auth();
            db = firebase.firestore();
        } catch (error) { console.error("Firebase init error:", error); }

        // Core State
        let firebaseUser = null; 
        let currentUser = null; 
        let allUsers = [], allResources = [], allChats = [], allPosts = [];
        let currentTab = 'feed', activeChatUserId = null;
        let unsubscribeListeners = [];

        // UI Utils
        const showLoader = (text = "Loading...") => { document.getElementById('loader-text').innerText = text; document.getElementById('loader').classList.remove('hidden'); };
        const hideLoader = () => document.getElementById('loader').classList.add('hidden');
        const switchView = (viewId) => { document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden')); document.getElementById(viewId).classList.remove('hidden'); };
        const toggleTheme = () => { document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark'; };

        // Custom Modal UI (Replaces alert/confirm/prompt)
        function showModal(title, bodyHTML, actions = []) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;
            const actionsContainer = document.getElementById('modal-actions');
            actionsContainer.innerHTML = '';
            
            if (actions.length === 0) actions = [{ text: 'OK', class: 'btn-primary', onClick: closeModal }];
            
            actions.forEach(act => {
                const btn = document.createElement('button');
                btn.className = `btn ${act.class || 'btn-primary'}`;
                btn.style.flex = "1";
                btn.innerText = act.text;
                btn.onclick = () => { if(act.onClick) act.onClick(); closeModal(); };
                actionsContainer.appendChild(btn);
            });
            document.getElementById('custom-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); }

        // Format Date
        function timeAgo(ms) {
            const diff = Date.now() - ms;
            const minutes = Math.floor(diff / 60000);
            if(minutes < 1) return 'Just now';
            if(minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if(hours < 24) return `${hours}h ago`;
            return new Date(ms).toLocaleDateString();
        }

        // Init Flow
        window.onload = async () => {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.body.dataset.theme = 'dark';
            showLoader("Connecting securely...");
            try {
                // FIXED: Using Firebase Compat Auth functions correctly
                if (initToken) await auth.signInWithCustomToken(initToken);
                else await auth.signInAnonymously();

                auth.onAuthStateChanged((user) => {
                    firebaseUser = user;
                    if (user) setupDatabaseListeners();
                });
            } catch (err) { console.error(err); showModal("Connection Error", "Please refresh the page."); hideLoader(); }
        };

        // Utility to map paths cleanly in compat API format
        const getRef = (coll) => db.collection(`artifacts/${appId}/public/data/${coll}`);

        function setupDatabaseListeners() {
            if (!firebaseUser) return;

            // FIXED: Using Firestore Compat API cleanly
            unsubscribeListeners.push(getRef('users').onSnapshot((snap) => {
                allUsers = snap.docs.map(d => ({id: d.id, friends: [], friendRequests: [], ...d.data()}));
                if (currentUser && currentUser.id !== 'admin') {
                    const updatedMe = allUsers.find(u => u.id === currentUser.id);
                    if (updatedMe && JSON.stringify(updatedMe) !== JSON.stringify(currentUser)) {
                        const statusChanged = updatedMe.status !== currentUser.status;
                        currentUser = updatedMe;
                        if(statusChanged) routeUser();
                        else if(currentTab === 'profile') renderProfile();
                    }
                }
                if (currentUser?.role === 'admin') renderAdminView();
                else if (currentUser && currentTab === 'community') renderCommunity();
                if (!currentUser && document.getElementById('loader').classList.contains('hidden') === false) { hideLoader(); routeUser(); }
            }, (err) => console.error("Users error", err)));

            unsubscribeListeners.push(getRef('posts').onSnapshot((snap) => {
                allPosts = snap.docs.map(d => ({id: d.id, likes: [], comments: [], ...d.data()}));
                if (currentUser && currentTab === 'feed') renderFeed();
            }, (err) => console.error("Posts error", err)));

            unsubscribeListeners.push(getRef('resources').onSnapshot((snap) => {
                allResources = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp - a.timestamp);
                if (currentUser && currentTab === 'resources') renderResources('pdf');
            }, (err) => console.error("Resources error", err)));

            unsubscribeListeners.push(getRef('chats').onSnapshot((snap) => {
                allChats = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => a.timestamp - b.timestamp);
                if (activeChatUserId) renderChatMessages();
                if (currentUser && currentTab === 'chat-list') renderChatList();
            }, (err) => console.error("Chats error", err)));
        }

        function routeUser() {
            if (!currentUser) switchView('view-login');
            else if (currentUser.role === 'admin') { switchView('view-admin'); currentAdminTab='pending'; renderAdminView(); }
            else if (currentUser.status === 'pending') switchView('view-waiting');
            else { switchView('view-dashboard'); switchTab('feed', document.querySelector('.bottom-nav .nav-item')); }
        }

        function logout() { currentUser = null; activeChatUserId = null; routeUser(); }

        // --- AUTH ---
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!firebaseUser) return;
            const phone = document.getElementById('reg-phone').value;
            if (allUsers.some(u => u.phone === phone)) return showModal("Error", "Mobile number already registered!");

            const newUser = {
                name: document.getElementById('reg-name').value, phone, password: document.getElementById('reg-pass').value,
                college: document.getElementById('reg-college').value, branch: document.getElementById('reg-branch').value,
                semester: document.getElementById('reg-sem').value, session: document.getElementById('reg-session').value,
                dp: document.getElementById('reg-dp').value || '', bio: document.getElementById('reg-bio').value || '',
                status: 'pending', role: 'student', friends: [], friendRequests: [], timestamp: Date.now()
            };
            showLoader("Registering...");
            try {
                // FIXED: Using Compat API for setting new doc
                const docRef = getRef('users').doc();
                await docRef.set(newUser);
                currentUser = {id: docRef.id, ...newUser};
                hideLoader(); routeUser();
            } catch (err) { hideLoader(); showModal("Error", "Registration failed."); }
        });

        document.getElementById('form-login').addEventListener('submit', (e) => {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value, pass = document.getElementById('login-pass').value;
            if (phone === 'admin' && pass === 'admin123') { currentUser = { id: 'admin_sys', role: 'admin', name: 'System Admin', status: 'approved', friends:[] }; routeUser(); return; }
            const user = allUsers.find(u => u.phone === phone && u.password === pass);
            if (user) { currentUser = user; routeUser(); } else showModal("Login Failed", "Invalid credentials.");
        });

        // --- NAVIGATION ---
        function switchTab(tabId, el) {
            currentTab = tabId;
            document.querySelectorAll('.bottom-nav .nav-item').forEach(nav => nav.classList.remove('active'));
            if(el) el.classList.add('active');
            const content = document.getElementById('dashboard-content');
            const template = document.getElementById(`tpl-${tabId}`);
            const titles = { 'feed': 'Community Feed', 'community': 'Student Hub', 'resources': 'Study Materials', 'chat-list': 'Direct Messages', 'profile': 'My Profile' };
            document.getElementById('header-title').innerText = titles[tabId];

            if (template) {
                content.innerHTML = template.innerHTML;
                if (tabId === 'feed') renderFeed();
                if (tabId === 'community') renderCommunity();
                if (tabId === 'resources') renderResources('pdf');
                if (tabId === 'chat-list') renderChatList();
                if (tabId === 'profile') renderProfile();

        }

        // --- 1. COMMUNITY FEED ---
        async function createPost() {
            const input = document.getElementById('new-post-content');
            const vis = document.getElementById('new-post-vis').value;
            const text = input.value.trim();
            if(!text) return;

            try {
                // FIXED: Using Compat API for adding a doc
                await getRef('posts').add({
                    userId: currentUser.id, content: text, visibility: vis, timestamp: Date.now(),
                    likes: [], comments: [], pinned: false
                });
                input.value = '';
            } catch(e) { showModal("Error", "Could not post."); }
        }

        function renderFeed() {
            const container = document.getElementById('feed-list');
            if(!container) return;
            const query = (document.getElementById('search-feed')?.value || '').toLowerCase();

            let displayPosts = allPosts.filter(p => {
                const author = allUsers.find(u => u.id === p.userId) || {name: 'Unknown', branch:'', college:''};
                let canSee = false;
                if(p.visibility === 'public' || p.userId === currentUser.id || currentUser.role === 'admin') canSee = true;
                else if(currentUser.friends && currentUser.friends.includes(p.userId)) canSee = true;
                if(!canSee) return false;

                if(query) {
                    const searchStr = `${p.content} ${author.name} ${author.branch} ${author.college}`.toLowerCase();
                    if(!searchStr.includes(query)) return false;
                }
                return true;
            });

            displayPosts.sort((a, b) => {
                if(a.pinned && !b.pinned) return -1;
                if(!a.pinned && b.pinned) return 1;
                return b.timestamp - a.timestamp;
            });

            if (displayPosts.length === 0) {
                container.innerHTML = `<p class="text-center text-muted mt-2">No posts found.</p>`;
                return;
            }

            let html = '';
            displayPosts.forEach(p => {
                const author = allUsers.find(u => u.id === p.userId) || {name: 'Deleted User', branch:'', college:'', sem: '', dp: ''};
                const dpHtml = author.dp ? `<img src="${author.dp}" class="avatar">` : `<div class="avatar">${author.name.charAt(0)}</div>`;
                const isLiked = p.likes.includes(currentUser.id);
                
                const canEdit = p.userId === currentUser.id || currentUser.role === 'admin';
                const adminOptions = currentUser.role === 'admin' ? `<button class="action-btn" onclick="togglePin('${p.id}', ${!p.pinned})"><i class="fa-solid fa-thumbtack"></i></button>` : '';
                const editOptions = canEdit ? `
                    <button class="action-btn" onclick="initEditPost('${p.id}')"><i class="fa-solid fa-pen"></i></button>
                    <button class="action-btn" style="color:var(--danger-color);" onclick="initDeletePost('${p.id}')"><i class="fa-solid fa-trash"></i></button>
                ` : '';

                const pinnedBadge = p.pinned ? `<div class="pinned-badge"><i class="fa-solid fa-thumbtack"></i> Pinned Announcement</div>` : '';
                const privacyIcon = p.visibility === 'private' ? `<i class="fa-solid fa-user-group text-muted" style="font-size:0.7rem;" title="Friends Only"></i>` : '';

                let commentsHtml = '';
                p.comments.forEach(c => {
                    const cAuthor = allUsers.find(u => u.id === c.userId) || {name: 'User', dp:''};
                    const cDpHtml = cAuthor.dp ? `<img src="${cAuthor.dp}" class="avatar">` : `<div class="avatar">${cAuthor.name.charAt(0)}</div>`;
                    commentsHtml += `
                        <div class="comment-item">
                            ${cDpHtml}
                            <div style="flex:1;">
                                <strong style="font-size:0.85rem;">${cAuthor.name}</strong> <small class="text-muted">${timeAgo(c.timestamp)}</small>
                                <p style="font-size:0.85rem; margin-top:0.2rem;">${c.text}</p>
                            </div>
                        </div>
                    `;
                });

                html += `
                    <div class="post-card">
                        ${pinnedBadge}
                        <div class="post-header">
                            <div class="post-user-info">
                                ${dpHtml}
                                <div>
                                    <h4>${author.name} ${privacyIcon}</h4>
                                    <p>${author.branch} • ${author.college} • ${timeAgo(p.timestamp)}</p>
                                </div>
                            </div>
                            <div class="flex gap-2">${adminOptions}${editOptions}</div>
                        </div>
                        <div class="post-content">${p.content}</div>
                        <div class="post-actions">
                            <button class="action-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${p.id}')">
                                <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart"></i> ${p.likes.length}
                            </button>
                            <button class="action-btn" onclick="toggleComments('${p.id}')">
                                <i class="fa-regular fa-comment"></i> ${p.comments.length}
                            </button>
                            <button class="action-btn" onclick="sharePost('${p.content.substring(0, 30)}...')">
                                <i class="fa-solid fa-share-nodes"></i> Share
                            </button>
                        </div>
                        <div class="comments-section" id="comments-${p.id}">
                            <div class="flex gap-2 mb-2">
                                <input type="text" id="comment-input-${p.id}" class="form-control" style="padding:0.5rem; font-size:0.85rem;" placeholder="Write a comment...">
                                <button class="btn btn-primary" style="width:auto; padding: 0.5rem;" onclick="addComment('${p.id}')"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                            ${commentsHtml}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function toggleLike(postId) {
            const post = allPosts.find(p => p.id === postId);
            if(!post) return;
            const likes = [...post.likes];
            const idx = likes.indexOf(currentUser.id);
            if(idx > -1) likes.splice(idx, 1); else likes.push(currentUser.id);
            // FIXED: Update via Compat API
            try { await getRef('posts').doc(postId).update({ likes }); } catch(e) { console.error(e); }
        }

        function toggleComments(postId) {
            const el = document.getElementById(`comments-${postId}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        async function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if(!text) return;
            const post = allPosts.find(p => p.id === postId);
            // Just use a timestamp combo for quick unique IDs on comments since it's an array
            const newComment = { id: `c_${Date.now()}`, userId: currentUser.id, text, timestamp: Date.now() };
            try { await getRef('posts').doc(postId).update({ comments: [...post.comments, newComment] }); } catch(e) { console.error(e); }
        }

        function initEditPost(postId) {
            const post = allPosts.find(p => p.id === postId);
            const body = `<textarea id="edit-content-${postId}" class="form-control" rows="4">${post.content}</textarea>`;
            showModal("Edit Post", body, [
                { text: "Cancel", class: "btn-outline" },
                { text: "Save", class: "btn-primary", onClick: () => saveEditPost(postId) }
            ]);
        }

        async function saveEditPost(postId) {
            const newContent = document.getElementById(`edit-content-${postId}`).value.trim();
            if(!newContent) return;
            try { await getRef('posts').doc(postId).update({ content: newContent }); } catch(e) {}
        }

        function initDeletePost(postId) {
            showModal("Delete Post", "Are you sure you want to permanently delete this post?", [
                { text: "Cancel", class: "btn-outline" },
                { text: "Delete", class: "btn-danger", onClick: async () => {
                    try { await getRef('posts').doc(postId).delete(); } catch(e) {}
                }}
            ]);
        }

        async function togglePin(postId, pinStatus) {
            try { await getRef('posts').doc(postId).update({ pinned: pinStatus }); } catch(e) {}
        }

        function sharePost(textPreview) {
            const shareText = `Check out this update on PolyHub: "${textPreview}"`;
            try {
                document.execCommand('copy'); 
                showModal("Shared!", "Post link/text copied to clipboard. (Simulated for Demo)");
            } catch(e) { showModal("Share", shareText); }
        }

        // --- 2. HUB & FRIENDS ---
        function renderCommunity(searchQuery = '') {
            const listContainer = document.getElementById('community-list');
            if(!listContainer) return;
            const displayUsers = allUsers.filter(u => 
                u.status === 'approved' && u.id !== currentUser.id && u.role !== 'admin' &&
                (u.name.toLowerCase().includes(searchQuery) || u.college.toLowerCase().includes(searchQuery))
            );

            let html = displayUsers.length === 0 ? `<p class="text-center text-muted mt-2">No students found.</p>` : '';
            displayUsers.forEach(u => {
                const dpHtml = u.dp ? `<img src="${u.dp}" class="avatar">` : `<div class="avatar">${u.name.charAt(0)}</div>`;
                
                let friendBtn = '';
                const isFriend = currentUser.friends?.includes(u.id);
                const sentRequest = u.friendRequests?.includes(currentUser.id);
                const receivedRequest = currentUser.friendRequests?.includes(u.id);

                if (isFriend) {
                    friendBtn = `<button class="btn btn-outline" style="padding:0.4rem; font-size:0.75rem;" disabled><i class="fa-solid fa-user-check"></i> Friends</button>`;
                } else if (sentRequest) {
                    friendBtn = `<button class="btn btn-outline" style="padding:0.4rem; font-size:0.75rem;" disabled>Requested</button>`;
                } else if (receivedRequest) {
                    friendBtn = `<button class="btn btn-success" style="padding:0.4rem; font-size:0.75rem;" onclick="acceptFriend('${u.id}')">Accept</button>`;
                } else {
                    friendBtn = `<button class="btn btn-primary" style="padding:0.4rem; font-size:0.75rem;" onclick="addFriend('${u.id}')"><i class="fa-solid fa-user-plus"></i> Add</button>`;
                }

                html += `
                    <div class="list-card">
                        <div class="flex align-center gap-2" style="flex:1;" onclick="openChat('${u.id}')">
                            ${dpHtml}
                            <div><h4 style="font-size:0.95rem;">${u.name}</h4><p style="font-size:0.75rem;">${u.branch} | ${u.college}</p></div>
                        </div>
                        <div class="flex flex-col gap-2">${friendBtn}</div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function filterCommunity() { renderCommunity(document.getElementById('search-users').value.toLowerCase()); }

        async function addFriend(targetId) {
            const targetUser = allUsers.find(u => u.id === targetId);
            const reqs = targetUser.friendRequests || [];
            if(!reqs.includes(currentUser.id)) {
                try { await getRef('users').doc(targetId).update({ friendRequests: [...reqs, currentUser.id] }); } catch(e){}
            }
        }
        
        async function acceptFriend(requesterId) {
            const myFriends = [...(currentUser.friends || []), requesterId];
            const myReqs = (currentUser.friendRequests || []).filter(id => id !== requesterId);
            const reqUser = allUsers.find(u => u.id === requesterId);
            const theirFriends = [...(reqUser.friends || []), currentUser.id];
            try {
                // FIXED: Using Compat API DB Batch
                const batch = db.batch();
                batch.update(getRef('users').doc(currentUser.id), { friends: myFriends, friendRequests: myReqs });
                batch.update(getRef('users').doc(requesterId), { friends: theirFriends });
                await batch.commit();
                showModal("Success", "Friend request accepted!");
            } catch(e) {}
        }

        function renderProfile() {
            if(!currentUser) return;
            document.getElementById('my-name').innerText = currentUser.name;
            document.getElementById('my-branch').innerText = `${currentUser.branch} - ${currentUser.semester} Sem`;
            document.getElementById('my-college').innerText = currentUser.college;
            
            const dpContainer = document.getElementById('profile-dp-container');
            if(currentUser.dp) dpContainer.innerHTML = `<img src="${currentUser.dp}" class="avatar mb-2" style="width:100px; height:100px; margin:0 auto;">`;
            else dpContainer.innerHTML = `<div class='avatar mb-2' style='width:100px;height:100px;margin:0 auto;font-size:3rem'>${currentUser.name.charAt(0)}</div>`;

            const reqArea = document.getElementById('friend-requests-area');
            const reqs = currentUser.friendRequests || [];
            if(reqs.length > 0) {
                let rHtml = `<div class="glass-panel" style="padding:1rem;"><h4 class="mb-1 text-left" style="color:var(--primary-color)">Friend Requests (${reqs.length})</h4>`;
                reqs.forEach(reqId => {
                    const u = allUsers.find(x => x.id === reqId);
                    if(u) rHtml += `<div class="flex justify-between align-center mb-1"><span style="font-size:0.85rem;">${u.name}</span> <button class="btn btn-success" style="width:auto; padding:0.3rem 0.6rem; font-size:0.75rem;" onclick="acceptFriend('${u.id}')">Accept</button></div>`;
                });
                rHtml += `</div>`;
                reqArea.innerHTML = rHtml;
            } else { reqArea.innerHTML = ''; }
        }


        // --- 3. RESOURCES & CHAT ---
        function renderResources(type) {
            document.querySelectorAll('#tpl-resources .view-tab').forEach(t => t.classList.remove('active'));
            if(event) event.target.classList.add('active');
            const container = document.getElementById('resources-list');
            if(!container) return;
            const filtered = allResources.filter(r => r.type === type);
            let html = filtered.length ? '' : `<p class="text-center text-muted mt-2">No ${type}s shared yet.</p>`;
            filtered.forEach(r => {

                    ? `<a href="${r.content}" target="_blank" class="btn btn-primary" style="padding:0.4rem 0.8rem; font-size:0.8rem; width:auto;">Open PDF</a>`
                    : `<button class="btn btn-primary" style="padding:0.4rem 0.8rem; font-size:0.8rem; width:auto;" onclick="showModal('${r.title}', '${r.content}')">Read</button>`;

                    <div class="list-card flex-col align-start" style="align-items:flex-start;">

                            ${actionBtn}
                        </div>
                    </div>`;

        async function addResource() {
            const type = document.getElementById('res-type').value, title = document.getElementById('res-title').value, content = document.getElementById('res-content').value;
            if(!title || !content) return showModal("Error", "Fill all fields");
            try {
                await getRef('resources').add({ type, title, content, uploaderId: currentUser.id, timestamp: Date.now() });
                document.getElementById('res-title').value = ''; document.getElementById('res-content').value = ''; showModal("Success", "Resource shared!");
            } catch (err) { }
        }

        // CHAT
        function openChat(userId) {
            activeChatUserId = userId;
            const user = allUsers.find(u => u.id === userId);
            document.getElementById('chat-header-name').innerText = user.name;
            document.getElementById('chat-header-avatar').innerHTML = user.dp ? `<img src="${user.dp}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : user.name.charAt(0);
            document.getElementById('view-chatroom').classList.remove('hidden');
            renderChatMessages();
        }
        function closeChat() { document.getElementById('view-chatroom').classList.add('hidden'); activeChatUserId = null; switchTab('chat-list', document.querySelectorAll('.bottom-nav .nav-item')[3]); }
        
        function renderChatMessages() {
            if (!activeChatUserId) return;
            const container = document.getElementById('chat-messages-area');
            const msgs = allChats.filter(c => (c.senderId === currentUser.id && c.receiverId === activeChatUserId) || (c.senderId === activeChatUserId && c.receiverId === currentUser.id));
            let html = msgs.length ? '' : `<div style="text-align:center; color: var(--text-muted); margin: auto 0;">Say hi securely!</div>`;
            msgs.forEach(m => {
                const isMine = m.senderId === currentUser.id;
                html += `<div style="max-width:75%; padding:0.6rem 0.8rem; border-radius:12px; font-size:0.9rem; line-height:1.3; ${isMine ? 'background:var(--primary-color);color:white;align-self:flex-end;border-bottom-right-radius:2px;' : 'background:var(--input-bg);align-self:flex-start;border-bottom-left-radius:2px;'}">
                    ${m.text} <div style="font-size:0.6rem;text-align:right;opacity:0.7;margin-top:0.2rem;">${new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
                </div>`;
            });
            container.innerHTML = html; container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !activeChatUserId) return;
            input.value = '';
            try { await getRef('chats').add({ senderId: currentUser.id, receiverId: activeChatUserId, text, timestamp: Date.now() }); } catch(e){}
        }

        function renderChatList() {
            const container = document.getElementById('active-chats-list');
            if(!container) return;
            const chatPartners = new Set();
            allChats.forEach(c => { if(c.senderId === currentUser.id) chatPartners.add(c.receiverId); if(c.receiverId === currentUser.id) chatPartners.add(c.senderId); });
            let html = chatPartners.size ? '' : `<p class="text-center text-muted">No chats. Message someone in the Hub!</p>`;
            chatPartners.forEach(pid => {
                const p = allUsers.find(u => u.id === pid);
                if(p) html += `<div class="list-card" onclick="openChat('${p.id}')" style="cursor:pointer;"><div class="flex align-center gap-2">${p.dp ? `<img src="${p.dp}" class="avatar">`:`<div class="avatar">${p.name.charAt(0)}</div>`}<div><h4 style="font-size:0.95rem;">${p.name}</h4><p style="font-size:0.75rem;">Tap to view messages</p></div></div><i class="fa-solid fa-chevron-right text-muted"></i></div>`;
            });
            container.innerHTML = html;
        }

        // --- ADMIN ---
        function switchAdminTab(tab, el) {
            currentAdminTab = tab;
            document.querySelectorAll('#view-admin .view-tab').forEach(t => t.classList.remove('active'));
            if(el) el.classList.add('active');
            renderAdminView();
        }
        function renderAdminView() {
            const container = document.getElementById('admin-content-area');
            let html = '';
            if (currentAdminTab === 'pending') {
                const pend = allUsers.filter(u => u.status === 'pending');
                if(!pend.length) html = `<p class="text-center mt-2">No pending approvals.</p>`;
                pend.forEach(u => html += `<div class="list-card flex-col align-start"><div class="mb-1"><h4>${u.name}</h4><p style="font-size:0.8rem;">${u.phone} | ${u.college} (${u.branch})</p></div><div class="flex gap-2" style="width:100%;"><button class="btn btn-success" style="flex:1;" onclick="updateUserStatus('${u.id}', 'approved')">Approve</button><button class="btn btn-danger" style="flex:1;" onclick="updateUserStatus('${u.id}', 'rejected')">Reject</button></div></div>`);
            } else if (currentAdminTab === 'all') {
                allUsers.filter(u => u.role !== 'admin').forEach(u => html += `<div class="list-card flex justify-between align-center"><div><h4>${u.name}</h4><strong style="color:${u.status==='approved'?'var(--success-color)':'orange'}; font-size:0.75rem;">${u.status.toUpperCase()}</strong></div><button class="btn btn-danger" style="width:auto;padding:0.5rem;" onclick="deleteUser('${u.id}')"><i class="fa-solid fa-trash"></i></button></div>`);
            }
            container.innerHTML = html;
        }

        async function updateUserStatus(userId, st) {
            try { await getRef('users').doc(userId).update({ status: st }); } catch(e){}
        }
        function deleteUser(userId) {
            showModal("Delete User", "Permanently remove this account?", [{ text: "Cancel", class: "btn-outline" }, { text: "Delete", class: "btn-danger", onClick: async () => {
                try { await getRef('users').doc(userId).delete(); } catch(e){}
            }}]);
        }
    </script>
</body>
</html>
